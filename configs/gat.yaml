seed: 42

experiment_name: gat

dataset:
  train_path: data/zinc/train.pt
  val_path: data/zinc/val.pt
  test_path: data/zinc/test.pt

  batch_size: 512
  num_workers: 0

encoder:
  m_type: gat
  emb_dim: 300
  out_dim: 256
  num_layer: 5
  drop_ratio: 0.1
  num_heads: 4
  residual: true
  concat: false
  pool: mean
  encoding: true
  pretrain: true


node_decoder:
  m_type: gin
  emb_dim: 300
  out_dim: 256
  num_layer: 1
  drop_ratio: 0.1
  pool: mean
  encoding: false
  pretrain: true

mae:
  num_layers: 5
  dec_in_dim: 300
  node_mask_rate: 0.75
  loss_fn: sce
  alpha_l: 2
  concat_hidden: false

clr:
  use_cosine_similarity: true
  temperature: 0.5

model:
  num_layers: 5
  emb_dim: 300
  dec_in_dim: 300
  node_mask_rate: 0.75
  loss_fn: sce
  alpha_l: 2
  concat_hidden: false
  gamma: 0.5


train:
  epochs: 200
  lr: 1.0e-4
  optimizer: AdamW
  weight_decay: 1.0e-5
  scheduler: Cosine
  probe_freq: 5
  gamma_scheduler: false
  gamma_warmup_epochs: 25

eval:
  epochs: 50
save:
  output_dir: outputs